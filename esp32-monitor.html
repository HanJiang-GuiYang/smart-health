<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 实时心率监测 - 智养未来</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .esp32-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .esp32-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .esp32-header h1 {
            color: var(--gold);
            font-size: 32px;
            margin-bottom: 10px;
        }

        .esp32-header p {
            color: var(--gray-400);
            font-size: 14px;
        }

        .esp32-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gray-600);
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-dot.error {
            background: #ff5b67;
            box-shadow: 0 0 10px #ff5b67;
        }

        .config-panel {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .config-panel input {
            background: var(--black-light);
            border: 1px solid var(--glass-border);
            color: var(--white);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
        }

        .config-panel button {
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .config-panel button:hover {
            background: var(--gold-light);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-label {
            color: var(--gray-400);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .metric-value {
            color: var(--gold);
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 5px;
        }

        .metric-unit {
            color: var(--gray-500);
            font-size: 14px;
        }

        .metric-trend {
            margin-top: 10px;
            font-size: 13px;
            color: var(--gray-400);
        }

        .trend-up {
            color: #ff5b67;
        }

        .trend-down {
            color: #38d9e6;
        }

        .trend-stable {
            color: #4ade80;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-title {
            color: var(--gold);
            font-size: 18px;
            font-weight: bold;
        }

        .chart-stats {
            color: var(--gray-400);
            font-size: 12px;
        }

        .chart-wrapper {
            height: 250px;
            position: relative;
        }

        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .data-log {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .data-log h3 {
            color: var(--gold);
            margin-bottom: 15px;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 13px;
            color: var(--gray-400);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--gray-500);
            margin-right: 10px;
        }

        .log-data {
            color: var(--gray-300);
        }

        @media (max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }

            .config-panel {
                flex-direction: column;
                width: 100%;
            }

            .config-panel input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="esp32-container">
        <div class="esp32-header">
            <h1><i class="fas fa-heartbeat"></i> ESP32 实时心率监测</h1>
            <p>MAX30102 传感器 · 4 秒算法窗口 · 实时数据同步</p>
        </div>

        <div class="esp32-status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">等待连接</span>
            </div>
            <div class="config-panel">
                <input type="text" id="esp32Address" value="http://max30102.local" placeholder="ESP32 地址">
                <button id="connectBtn"><i class="fas fa-plug"></i> 连接</button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">稳定心率</div>
                <div class="metric-value" id="stableHR">--</div>
                <div class="metric-unit">BPM</div>
                <div class="metric-trend" id="hrTrend">等待数据</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">算法原始心率</div>
                <div class="metric-value" id="rawHR">--</div>
                <div class="metric-unit">BPM</div>
                <div class="metric-trend">用于观察瞬时跳变</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">血氧饱和度</div>
                <div class="metric-value" id="spo2">--</div>
                <div class="metric-unit">%</div>
                <div class="metric-trend" id="spo2Age">尚未采样</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title"><i class="fas fa-chart-line"></i> 心率趋势</div>
                    <div class="chart-stats" id="hrStats">--</div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="hrChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title"><i class="fas fa-chart-area"></i> 血氧趋势</div>
                    <div class="chart-stats" id="spo2Stats">--</div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="spo2Chart"></canvas>
                </div>
            </div>
        </div>

        <div class="data-log">
            <h3><i class="fas fa-history"></i> 数据日志</h3>
            <div id="logContainer"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 数据历史
        const history = {
            stable: [],
            raw: [],
            spo2: []
        };
        let lastId = -1;
        let pollTimer = null;
        let isConnected = false;

        // DOM 元素
        const elements = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            esp32Address: document.getElementById('esp32Address'),
            connectBtn: document.getElementById('connectBtn'),
            stableHR: document.getElementById('stableHR'),
            rawHR: document.getElementById('rawHR'),
            spo2: document.getElementById('spo2'),
            hrTrend: document.getElementById('hrTrend'),
            spo2Age: document.getElementById('spo2Age'),
            hrStats: document.getElementById('hrStats'),
            spo2Stats: document.getElementById('spo2Stats'),
            logContainer: document.getElementById('logContainer')
        };

        // 图表实例
        let hrChart, spo2Chart;

        // 初始化图表
        function initCharts() {
            const hrCtx = document.getElementById('hrChart').getContext('2d');
            const spo2Ctx = document.getElementById('spo2Chart').getContext('2d');

            hrChart = new Chart(hrCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '稳定心率',
                            data: [],
                            borderColor: '#38d9e6',
                            backgroundColor: 'rgba(56, 217, 230, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '原始心率',
                            data: [],
                            borderColor: '#ff5b67',
                            backgroundColor: 'rgba(255, 91, 103, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#91a4bb' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#91a4bb' },
                            grid: { color: 'rgba(56, 217, 230, 0.1)' }
                        },
                        y: {
                            min: 40,
                            max: 160,
                            ticks: { color: '#91a4bb' },
                            grid: { color: 'rgba(56, 217, 230, 0.1)' }
                        }
                    }
                }
            });

            spo2Chart = new Chart(spo2Ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '血氧饱和度',
                        data: [],
                        borderColor: '#4ade80',
                        backgroundColor: 'rgba(74, 222, 128, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#91a4bb' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#91a4bb' },
                            grid: { color: 'rgba(74, 222, 128, 0.1)' }
                        },
                        y: {
                            min: 85,
                            max: 100,
                            ticks: { color: '#91a4bb' },
                            grid: { color: 'rgba(74, 222, 128, 0.1)' }
                        }
                    }
                }
            });
        }

        // 更新状态显示
        function updateStatus(connected, text) {
            elements.statusDot.className = 'status-dot ' + (connected ? 'connected' : 'error');
            elements.statusText.textContent = text;
        }

        // 添加日志
        function addLog(message) {
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-data">${message}</span>`;
            
            elements.logContainer.insertBefore(entry, elements.logContainer.firstChild);
            
            // 限制日志数量
            while (elements.logContainer.children.length > 50) {
                elements.logContainer.removeChild(elements.logContainer.lastChild);
            }
        }

        // 计算统计
        function calculateStats(data) {
            const valid = data.filter(v => Number.isFinite(v));
            if (valid.length === 0) return '--';
            
            const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
            const min = Math.min(...valid);
            const max = Math.max(...valid);
            
            return `均 ${avg.toFixed(0)} · 低 ${min} · 高 ${max}`;
        }

        // 更新趋势
        function updateTrend(data, element) {
            const valid = data.filter(v => Number.isFinite(v));
            if (valid.length < 2) {
                element.textContent = '数据不足';
                element.className = 'metric-trend';
                return;
            }
            
            const recent = valid.slice(-4);
            const delta = recent[recent.length - 1] - recent[0];
            
            if (Math.abs(delta) < 4) {
                element.textContent = '近期平稳';
                element.className = 'metric-trend trend-stable';
            } else if (delta > 0) {
                element.textContent = `近期上升 ${delta} BPM`;
                element.className = 'metric-trend trend-up';
            } else {
                element.textContent = `近期下降 ${Math.abs(delta)} BPM`;
                element.className = 'metric-trend trend-down';
            }
        }

        // 渲染数据
        function renderData(data) {
            const valid = data.hr_valid && data.stable_hr > 0;
            
            // 更新数值
            elements.stableHR.textContent = valid ? data.stable_hr : '--';
            elements.rawHR.textContent = data.hr_valid ? data.raw_hr : '--';
            elements.spo2.textContent = data.spo2_valid ? data.spo2 : '--';
            
            // 更新状态
            if (data.sensor_ready) {
                updateStatus(true, data.collecting ? '采集中...' : '已连接');
            } else {
                updateStatus(false, '传感器未就绪');
            }
            
            // 更新血氧年龄
            if (data.update_id) {
                const age = Math.floor(data.age_ms / 1000);
                elements.spo2Age.textContent = `上次完成 ${age} 秒前`;
            } else {
                elements.spo2Age.textContent = '正在准备第一组数据';
            }
            
            // 推入历史
            if (data.update_id !== lastId && data.update_id > 0) {
                lastId = data.update_id;
                
                const timeLabel = new Date().toLocaleTimeString();
                
                history.stable.push(valid ? data.stable_hr : null);
                history.raw.push(data.hr_valid ? data.raw_hr : null);
                history.spo2.push(data.spo2_valid ? data.spo2 : null);
                
                // 限制历史长度
                if (history.stable.length > 120) {
                    history.stable.shift();
                    history.raw.shift();
                    history.spo2.shift();
                }
                
                // 更新图表
                hrChart.data.labels.push(timeLabel);
                hrChart.data.datasets[0].data.push(valid ? data.stable_hr : null);
                hrChart.data.datasets[1].data.push(data.hr_valid ? data.raw_hr : null);
                
                spo2Chart.data.labels.push(timeLabel);
                spo2Chart.data.datasets[0].data.push(data.spo2_valid ? data.spo2 : null);
                
                // 保持图表长度
                if (hrChart.data.labels.length > 120) {
                    hrChart.data.labels.shift();
                    hrChart.data.datasets[0].data.shift();
                    hrChart.data.datasets[1].data.shift();
                    spo2Chart.data.labels.shift();
                    spo2Chart.data.datasets[0].data.shift();
                }
                
                hrChart.update('none');
                spo2Chart.update('none');
                
                // 更新统计
                elements.hrStats.textContent = calculateStats(history.stable);
                elements.spo2Stats.textContent = calculateStats(history.spo2);
                
                // 更新趋势
                updateTrend(history.stable, elements.hrTrend);
                
                // 添加日志
                if (valid) {
                    addLog(`心率: ${data.stable_hr} BPM, 血氧: ${data.spo2}%`);
                }
            }
        }

        // 轮询数据
        async function pollData() {
            try {
                const address = elements.esp32Address.value.trim();
                const response = await fetch(`${address}/data`, {
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                renderData(data);
                
                if (!isConnected) {
                    isConnected = true;
                    addLog('成功连接到 ESP32');
                }
            } catch (error) {
                console.error('数据拉取失败:', error);
                updateStatus(false, '连接中断');
                isConnected = false;
                addLog(`连接失败: ${error.message}`);
            }
        }

        // 连接按钮
        elements.connectBtn.addEventListener('click', () => {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
                elements.connectBtn.innerHTML = '<i class="fas fa-plug"></i> 连接';
                addLog('已断开连接');
            } else {
                elements.connectBtn.innerHTML = '<i class="fas fa-stop"></i> 断开';
                addLog(`开始连接 ${elements.esp32Address.value}...`);
                pollData(); // 立即执行一次
                pollTimer = setInterval(pollData, 1000); // 每秒轮询
            }
        });

        // 初始化
        initCharts();
        addLog('页面已加载，请输入 ESP32 地址并点击连接');
    </script>
</body>
</html>
